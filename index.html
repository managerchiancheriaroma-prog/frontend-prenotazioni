<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Scegli Ristorante</title>

  <style>
#bgLogo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  background-image: url("./logo.png");
  background-repeat: no-repeat;
  background-position: center;
  background-size: cover;

  opacity: 0.08;

  z-index: 0;
  pointer-events: none;
}

body {
  font-family: Arial;
  margin: 0;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  background: white;
}
html, body {
  height: 100%;
}
.container {
  position: relative;
  z-index: 1;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.restaurant-btn {
  width: 92%;
  max-width: 420px;

  padding: 28px 24px;

  margin: 14px auto;

  font-size: 24px;
  font-weight: 700;

  text-align: center;

  background: #111;
  color: white;

  border-radius: 18px;

  text-decoration: none;

  cursor: pointer;

  /* 🔥 migliora touch mobile */
  min-height: 70px;

  display: flex;
  align-items: center;
  justify-content: center;

  transition: transform 0.1s ease, background 0.2s ease;
}

/* effetto pressione (molto importante su mobile) */
.restaurant-btn:active {
  transform: scale(0.96);
  background: #222;
}
  </style>
</head>

<body>

<div id="bgLogo"></div>

<div class="container">

<h2>Scegli il ristorante</h2>

<a class="restaurant-btn" href="prenota.html?ristorante=roma">Roma</a>
<a class="restaurant-btn" href="prenota.html?ristorante=vairano">Vairano</a>
<a class="restaurant-btn" href="prenota.html?ristorante=napoli">Napoli</a>

</div>

</body>
</html>
