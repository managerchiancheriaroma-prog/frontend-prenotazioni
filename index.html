<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Scegli Ristorante</title>

  <style>

#bgLogo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  background-image: url("./logo.png");
  background-repeat: no-repeat;
  background-position: center;
  background-size: cover;

  opacity: 0.08;

  z-index: 0;
  pointer-events: none;
}

body {
  font-family: Arial;
  margin: 0;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  background: white;
}
    body {
  -webkit-tap-highlight-color: transparent;
}
html, body {
  height: 100%;
}
.container {
  position: relative;
  z-index: 1;

  width: 100%;
  height: 100vh;

  display: flex;
  flex-direction: column;

  align-items: center;

  padding: 60px 16px 16px 16px;
  box-sizing: border-box;

  gap: 18px;
}

.restaurant-btn {
  width: 100%;

  height: 22vh; /* 🔥 ogni bottone prende 22% schermo */

  display: flex;
  align-items: center;
  justify-content: center;

 font-size: 100px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;

  background: #0b3d2e;
  color: white;

  border-radius: 20px;

  text-decoration: none;

  cursor: pointer;

  transition: transform 0.15s ease, background 0.2s ease;
}

/* effetto touch */
.restaurant-btn:active {
  transform: scale(0.97);
  background: #222;
}
  .hero {
  text-align: center;
  margin-bottom: 20px;
}

.hero h1 {
  font-size: 9vw;
  font-weight: 900;
  margin: 0;
  color: #111;
}

.hero p {
  font-size: 4.5vw;
  margin-top: 10px;
  color: #555;
}
/* ANIMAZIONE INGRESSO */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(70px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* HERO */
.hero {
  animation: fadeUp 0.6s ease forwards;
}

/* BOTTONI */
.restaurant-btn {
  opacity: 0;
  animation: fadeUp 0.6s ease forwards;
}

/* RITARDO PROGRESSIVO (effetto a cascata) */
.restaurant-btn:nth-of-type(1) { animation-delay: 0.2s; }
.restaurant-btn:nth-of-type(2) { animation-delay: 0.35s; }
.restaurant-btn:nth-of-type(3) { animation-delay: 0.5s; }
    
  </style>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2e7d32">
<link rel="icon" href="/app-icon.png" type="image/png">
<link rel="apple-touch-icon" href="/app-icon.png">
</head>

<body>

<div id="bgLogo"></div>

<div class="container">

<div class="hero">
  <h1>Scegli il ristorante</h1>
  <p>Prenota in pochi secondi</p>
</div>

<a class="restaurant-btn" href="prenota.html?ristorante=roma">Roma</a>
<a class="restaurant-btn" href="prenota.html?ristorante=vairano">Vairano</a>
<a class="restaurant-btn" href="prenota.html?ristorante=napoli">Napoli</a>

</div>

</body>
</html>
