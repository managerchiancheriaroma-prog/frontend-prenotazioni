<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Prenota</title>

<style>
body {
  font-family: Arial;
  padding:12px;
  margin:0;
  box-sizing:border-box;
  position: relative;
  min-height: 100vh;
}

/* SFONDO LOGO */
#bgLogo {
  position: fixed;
  inset: 0;

  background-image: url("logo.png");
  background-size: 180%;
  background-position: center;
  background-repeat: no-repeat;

  opacity: 0.12;

  z-index: 0;
  pointer-events: none;
}  
*, *::before, *::after {
  box-sizing: border-box;
}
/* INPUT */
label {
  display:block;
  margin-top:15px;
}

input, button {
  width:100%;
  padding:16px;
  margin-top:8px;
  font-size:17px;
   border-radius:12px;
}

button {
  margin-top:20px;
  background:#111;
  color:white;
  border:none;
  border-radius:10px;
}

/* MESSAGGIO */
#messaggio {
  display:none;
  margin-top:20px;
  padding:15px;
  border-radius:10px;
  text-align:center;
  font-size:15px;
}

.ok { background:#d4edda; }
.error { background:#f8d7da; }

/* ===== SLOT BUTTON ===== */
#oraBtn {
  width:100%;
  padding:16px;
  margin-top:6px;
  font-size:18px;
  background:#f2f2f2;
  border-radius:12px;
  text-align:center;
}

/* ===== MODAL FULLSCREEN ===== */
#slotModal {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:white;
  display:none; /* 👈 SOLO QUESTO */
  z-index:9999;

  flex-direction:column;
}
/* HEADER */
.slot-header {
  padding:18px;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #eee;
}

/* LISTA SLOT */
#slotList {
  flex:1;
  overflow:auto;
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:12px;
  padding:15px;
}

/* SLOT */
.slot-btn {
  padding:20px 0;
  font-size:20px;
  border-radius:14px;
  text-align:center;
  border-radius:14px;
  background:#f5f5f5;
}

/* BOTTONE CHIUDI */
.slot-close {
  padding:18px;
  font-size:18px;
  background:#111;
  color:white;
  text-align:center;
}
  .container {
  position: relative;
  z-index: 1;

  max-width: 420px;
  margin: auto;
  margin-top: 20px;

  background: rgba(255,255,255,0.80);
  backdrop-filter: blur(10px);

  padding:16px;
  border-radius:18px;
}
#bgLogo {
  position: fixed;
  inset: 0;

  background-image: url("frontend-prenotazioni/logo.png");
  background-size: 200%;
  background-position: center;
  background-repeat: no-repeat;

  opacity: 0.12;

  z-index: 0;
  pointer-events: none;
}
</style>
</head>

<body>
  <div id="bgLogo"></div>
<div id="slotModal">
  <div class="slot-header">
    Seleziona orario
  </div>

  <div id="slotList"></div>

  <div class="slot-close" onclick="chiudiSlot()">
    Chiudi
  </div>
</div>
  
<div class="container">

<h2 id="titolo"></h2>

<form id="form">

<label>Data</label>
<input type="date" id="data" required>

<label>Ora</label>
<div id="oraBtn" onclick="apriSlot()" style="
  padding:12px;
  background:#eee;
  border-radius:8px;
  text-align:center;
  cursor:pointer;
">
  Seleziona orario
</div>

<input type="hidden" id="ora">

<label>Nome</label>
<input type="text" id="nome" required>

<label>Telefono</label>
<input type="text" id="telefono" required>

<label>Persone</label>
<input type="number" id="persone" required>

<button type="button" onclick="prenota()">Prenota</button>

</form>

<div id="messaggio"></div>

</div>

<script>

const API_URL = "/api/proxy";

const ORARI = {
  roma: {
    default: [{ start: "12:30", end: "23:00" }],
    sabato: [
      { start: "12:30", end: "20:00" },
      { start: "21:30", end: "23:00" }
    ]
  },

  vairano: {
    default: [{ start: "12:00", end: "22:00" }]
  },

  napoli: {
    default: [{ start: "13:00", end: "23:30" }]
  }
};
const params = new URLSearchParams(window.location.search);
const ristorante = params.get("ristorante");

titolo.innerText = ristorante ? "Prenota – " + ristorante : "Errore";
function generaSlot() {
  const selectedDate = new Date(data.value);
  const oggi = new Date();

  const config = ORARI[ristorante];
  if (!config) return [];

  const giorno = selectedDate.getDay();

  const fasce = (giorno === 6 && config.sabato)
    ? config.sabato
    : config.default;

  const slots = [];

  fasce.forEach(f => {
    let [h,m] = f.start.split(":").map(Number);
    const [endH,endM] = f.end.split(":").map(Number);

    while (h < endH || (h === endH && m <= endM)) {

      const time = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

      // blocca orari passati
      if (
        selectedDate.toDateString() === oggi.toDateString() &&
        time < oggi.toTimeString().slice(0,5)
      ) {
        m += 30;
        if (m >= 60) { m = 0; h++; }
        continue;
      }

      slots.push(time);

      m += 30;
      if (m >= 60) { m = 0; h++; }
    }
  });

  return slots;
}
function apriSlot(){
  const list = document.getElementById("slotList");
  list.innerHTML = "";

  const slots = generaSlot();

  slots.forEach(s => {
    const b = document.createElement("div");
    b.innerText = s;

    b.style = `
  flex:1 1 30%;
  text-align:center;
  padding:16px 0;
  background:#f2f2f2;
  border-radius:12px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
`;

    b.onclick = () => selezionaSlot(s);

    list.appendChild(b);
  });

  slotModal.style.display = "flex";
}

function selezionaSlot(s){
  ora.value = s;
  oraBtn.innerText = s;
  chiudiSlot();
}

function chiudiSlot(){
  slotModal.style.display = "none";
}
  slotModal.onclick = function(e){
  if (e.target === slotModal) {
    chiudiSlot();
  }
};
async function prenota() {
if (!ora.value) {
  alert("Seleziona un orario");
  return;
}
  
  const dati = {
    action:"prenota",
    ristorante,
    data:data.value,
    ora:ora.value,
    nome:nome.value,
    telefono:telefono.value,
    persone:Number(persone.value)
  };

  const res = await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(dati)
  });

  const json = await res.json();

  messaggio.style.display = "block";

  if (json.success) {

    messaggio.className = "ok";

    if (json.stato === "CONFERMATA") {
      messaggio.innerHTML = "✅ Prenotazione confermata ti aspettiamo";
    } else {
      messaggio.innerHTML = "⏳ a breve ti contatteremo per confermarti la prenotazione";
    }

    form.reset();

  } else {
    messaggio.className = "error";
    messaggio.innerHTML = "Errore: " + json.errore;
  }
}

</script>

</body>
</html>
