<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Prenota</title>

<style>
body { font-family: Arial; padding:20px; max-width:400px; margin:auto; }

label { display:block; margin-top:15px; }

input, button {
  width:100%;
  padding:10px;
  margin-top:5px;
}

button {
  margin-top:20px;
  background:#333;
  color:white;
  border:none;
  border-radius:6px;
}

#messaggio {
  display:none;
  margin-top:20px;
  padding:15px;
  border-radius:6px;
  text-align:center;
}

.ok { background:#d4edda; }
.error { background:#f8d7da; }
</style>
</head>

<body>
<div id="slotModal" style="
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  z-index:9999;
  justify-content:center;
  align-items:center;
">
  <div style="
    background:white;
    width:90%;
    max-width:400px;
    border-radius:20px;
    padding:20px;
    max-height:80%;
    overflow:auto;
  ">
  
  <h3 style="text-align:center; margin-bottom:15px;">
  Seleziona orario
</h3>
  <div id="slotList" style="
  display:flex;
  flex-wrap:wrap;
  gap:10px;
"></div>
 <button onclick="chiudiSlot()" style="
  margin-top:15px;
  background:#333;
  color:white;
  border:none;
  padding:12px;
  border-radius:10px;
">
  Chiudi
</button>
  </div>
</div>
<h2 id="titolo"></h2>

<form id="form">

<label>Data</label>
<input type="date" id="data" required>

<label>Ora</label>
<div id="oraBtn" onclick="apriSlot()" style="
  padding:12px;
  background:#eee;
  border-radius:8px;
  text-align:center;
  cursor:pointer;
">
  Seleziona orario
</div>

<input type="hidden" id="ora">

<label>Nome</label>
<input type="text" id="nome" required>

<label>Telefono</label>
<input type="text" id="telefono" required>

<label>Persone</label>
<input type="number" id="persone" required>

<button type="button" onclick="prenota()">Prenota</button>

</form>

<div id="messaggio"></div>

<script>

const API_URL = "/api/proxy";

const ORARI = {
  roma: {
    default: [{ start: "12:30", end: "23:00" }],
    sabato: [
      { start: "12:30", end: "20:00" },
      { start: "21:30", end: "23:00" }
    ]
  },

  vairano: {
    default: [{ start: "12:00", end: "22:00" }]
  },

  napoli: {
    default: [{ start: "13:00", end: "23:30" }]
  }
};
const params = new URLSearchParams(window.location.search);
const ristorante = params.get("ristorante");

titolo.innerText = ristorante ? "Prenota – " + ristorante : "Errore";
function generaSlot() {
  const selectedDate = new Date(data.value);
  const oggi = new Date();

  const config = ORARI[ristorante];
  if (!config) return [];

  const giorno = selectedDate.getDay();

  const fasce = (giorno === 6 && config.sabato)
    ? config.sabato
    : config.default;

  const slots = [];

  fasce.forEach(f => {
    let [h,m] = f.start.split(":").map(Number);
    const [endH,endM] = f.end.split(":").map(Number);

    while (h < endH || (h === endH && m <= endM)) {

      const time = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

      // blocca orari passati
      if (
        selectedDate.toDateString() === oggi.toDateString() &&
        time < oggi.toTimeString().slice(0,5)
      ) {
        m += 30;
        if (m >= 60) { m = 0; h++; }
        continue;
      }

      slots.push(time);

      m += 30;
      if (m >= 60) { m = 0; h++; }
    }
  });

  return slots;
}
function apriSlot(){
  const list = document.getElementById("slotList");
  list.innerHTML = "";

  const slots = generaSlot();

  slots.forEach(s => {
    const b = document.createElement("div");
    b.innerText = s;

    b.style = `
  flex:1 1 30%;
  text-align:center;
  padding:16px 0;
  background:#f2f2f2;
  border-radius:12px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
`;

    b.onclick = () => selezionaSlot(s);

    list.appendChild(b);
  });

  slotModal.style.display = "flex";
}

function selezionaSlot(s){
  ora.value = s;
  oraBtn.innerText = s;
  chiudiSlot();
}

function chiudiSlot(){
  slotModal.style.display = "none";
}
  slotModal.onclick = function(e){
  if (e.target === slotModal) {
    chiudiSlot();
  }
};
async function prenota() {
if (!ora.value) {
  alert("Seleziona un orario");
  return;
}
  
  const dati = {
    action:"prenota",
    ristorante,
    data:data.value,
    ora:ora.value,
    nome:nome.value,
    telefono:telefono.value,
    persone:Number(persone.value)
  };

  const res = await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(dati)
  });

  const json = await res.json();

  messaggio.style.display = "block";

  if (json.success) {

    messaggio.className = "ok";

    if (json.stato === "CONFERMATA") {
      messaggio.innerHTML = "✅ Prenotazione confermata ti aspettiamo";
    } else {
      messaggio.innerHTML = "⏳ a breve ti contatteremo per confermarti la prenotazione";
    }

    form.reset();

  } else {
    messaggio.className = "error";
    messaggio.innerHTML = "Errore: " + json.errore;
  }
}

</script>

</body>
</html>
