<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff Roma</title>

<style>
body {
  font-family: Arial;
  max-width:600px;
  margin:auto;
  padding:20px;
}

.card {
  border:1px solid #ddd;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
}

button {
  padding:6px 10px;
  margin-left:10px;
}
</style>

</head>

<body>

<h2>Staff Roma</h2>

<input type="date" id="data">
<button onclick="carica()">Carica</button>

<div id="lista"></div>

<script>

const API_URL = "/api/proxy";
const RISTORANTE = "roma";

async function carica() {

  const data = document.getElementById("data").value;

  const res = await fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      action: "getPrenotazioniGiorno",   // ✅ FIX
      ristorante: RISTORANTE,
      data: data
    })
  });

  const lista = await res.json();
  mostra(lista);
}

function mostra(lista) {
  const div = document.getElementById("lista");
  div.innerHTML = "";

  if (!lista || lista.length === 0) {
    div.innerHTML = "Nessuna prenotazione";
    return;
  }

  lista.forEach(p => {
    div.innerHTML += `
      <div class="card">
        <b>${p.ora}</b> - ${p.nome} (${p.persone})<br>
        Stato: ${p.stato || ""}

        <br><br>

        <button onclick="elimina(${p.row})">Elimina</button>
      </div>
    `;
  });
}

async function elimina(row) {

  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"eliminaPrenotazione",   // ✅ FIX
      ristorante: RISTORANTE,
      row: row
    })
  });

  carica();
}

</script>

</body>
</html>
