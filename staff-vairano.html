<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff Vairano</title>

<style>
body {
  font-family: Arial;
  max-width:600px;
  margin:auto;
  padding:20px;
}

.card {
  border:1px solid #ddd;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
}

.badge {
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  color:white;
}

.ok { background:green; }
.pending { background:orange; }

button {
  margin-top:8px;
  padding:6px 10px;
}
</style>
</head>

<body>

<h2>Staff Vairano</h2>

<input type="date" id="data">
<button onclick="carica()">Carica</button>

<div id="lista"></div>

<script>

const API_URL = "/api/proxy";
const RISTORANTE = "vairano";

async function carica() {

  const data = document.getElementById("data").value;

  const res = await fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      action: "getPrenotazioniGiorno",
      ristorante: RISTORANTE,
      data: data
    })
  });

  const json = await res.json();

  const lista = json.data || [];
  mostra(lista);
}

function mostra(lista) {

  const div = document.getElementById("lista");
  div.innerHTML = "";

  if (!lista.length) {
    div.innerHTML = "Nessuna prenotazione";
    return;
  }

  lista.forEach(p => {

    const badgeClass = p.stato === "PENDING" ? "pending" : "ok";

    div.innerHTML += `
      <div class="card">
        <b>${p.ora}</b> - ${p.nome} (${p.persone})<br>

        Stato:
        <span class="badge ${badgeClass}">
          ${p.stato}
        </span>

        <br>

        <button onclick="elimina(${p.row})">Elimina</button>
      </div>
    `;
  });
}

async function elimina(row) {

  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"eliminaPrenotazione",
      ristorante: RISTORANTE,
      row: row
    })
  });

  carica();
}

</script>

</body>
</html>
