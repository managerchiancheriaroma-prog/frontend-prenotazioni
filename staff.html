<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff</title>

<style>
body { font-family: Arial; max-width:1300px; margin:auto; padding:20px; background:#f5f5f5; }

#loginScreen {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.85); display:flex; justify-content:center; align-items:center; z-index:10000;
}

.loginBox { background:white; padding:30px; border-radius:10px; text-align:center; width:300px; }

.loginBox input, .loginBox select { width:100%; padding:10px; margin-top:10px; }

.loginBox button {
  width:100%; padding:10px; margin-top:15px;
  background:#333; color:white; border:none; border-radius:6px;
}

#overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.4); display:none; z-index:9998;
}

#toast {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:#333; color:white; padding:25px; border-radius:12px;
  display:none; z-index:9999; text-align:center; cursor:pointer;
}

.header { display:flex; justify-content:space-between; gap:20px; }

.left, .right { background:white; padding:15px; border-radius:10px; }

.container { display:flex; gap:20px; margin-top:20px; }

.col { flex:1; }

.card {
  background:white;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  cursor:pointer;
}

.selected { border:2px solid #00bcd4; }

.actions { margin-top:8px; }

.actions button {
  margin-right:5px;
  padding:5px 8px;
  font-size:12px;
}

.tavoli {
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:10px;
}

.tavolo {
  padding:15px;
  border-radius:10px;
  text-align:center;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.libero { background:#4caf50; }
.pending { background:#ff9800; }
.confermato { background:#f44336; }
.arrivato { background:#2196f3; }

.field { margin-top:10px; }
.field label { font-size:12px; color:#666; }
.field input { width:100%; padding:8px; margin-top:3px; }
</style>
</head>

<body>

<div id="loginScreen">
  <div class="loginBox">
    <h3>Login Staff</h3>

    <select id="loginRistorante">
      <option value="roma">Roma</option>
      <option value="napoli">Napoli</option>
      <option value="vairano">Vairano</option>
    </select>

    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Accedi</button>

    <p id="loginError" style="color:red;"></p>
  </div>
</div>

<div id="overlay"></div>
<div id="toast" onclick="closeToast()"></div>

<h2>Gestione Staff</h2>

<div class="header">

  <div class="left">
    <select id="ristorante" onchange="checkRistorante()">
      <option value="roma">Roma</option>
      <option value="napoli">Napoli</option>
      <option value="vairano">Vairano</option>
    </select>

    <input type="date" id="data" onchange="carica()">

    <select id="servizio" onchange="render()">
      <option value="tutti">Tutti</option>
      <option value="pranzo">Pranzo</option>
      <option value="cena">Cena</option>
    </select>
  </div>

  <div class="right">

    <b>➕ Nuova prenotazione</b>

    <div class="field">
      <label>Ora</label>
      <input type="time" id="ora">
    </div>

    <div class="field">
      <label>Nome cliente</label>
      <input type="text" id="nome" placeholder="Mario Rossi">
    </div>

    <div class="field">
      <label>Telefono</label>
      <input type="text" id="telefono" placeholder="3331234567">
    </div>

    <div class="field">
      <label>Numero persone</label>
      <input type="number" id="persone" placeholder="Es. 4">
    </div>

    <button onclick="aggiungi()">Aggiungi</button>

  </div>

</div>

<div class="container">

<div class="col">
  <h3>Prenotazioni</h3>
  <div id="lista"></div>
</div>

<div class="col">
  <h3>Sala Interna</h3>
  <div id="interna" class="tavoli"></div>

  <h3>Sala Esterna</h3>
  <div id="esterna" class="tavoli"></div>
</div>

</div>

<script>

const API_URL = "/api/proxy";

const PASSWORDS = {
  roma: "roma123",
  napoli: "napoli456",
  vairano: "vairano789"
};

let prenotazioni = [];
let selezionata = null;
let snapshot = [];
let auth = null;

// LOGIN
function login() {
  const r = document.getElementById("loginRistorante").value;
  const pw = document.getElementById("password").value;

  if (PASSWORDS[r] === pw) {
    auth = r;
    sessionStorage.setItem("staff_auth", r);

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("ristorante").value = r;
    document.getElementById("data").value = new Date().toISOString().split("T")[0];

    start();
  } else {
    document.getElementById("loginError").innerText = "Password errata";
  }
}

// INIT
window.onload = () => {
  const saved = sessionStorage.getItem("staff_auth");
  if (saved) {
    auth = saved;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("ristorante").value = saved;
    document.getElementById("data").value = new Date().toISOString().split("T")[0];
    start();
  }
};

function start() {
  carica();
  setInterval(refreshSilenzioso, 15000);
}

function checkRistorante() {
  if (document.getElementById("ristorante").value !== auth) {
    alert("Devi fare login per questo ristorante");
    document.getElementById("ristorante").value = auth;
  } else {
    carica();
  }
}

async function carica() {
  const res = await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"getPrenotazioniGiorno",
      ristorante:document.getElementById("ristorante").value,
      data:document.getElementById("data").value
    })
  });

  const json = await res.json();
  prenotazioni = json.data || [];
  render();
}

async function refreshSilenzioso() { carica(); }

function render() {
  document.getElementById("lista").innerHTML = JSON.stringify(prenotazioni);
}

function aggiungi() {}

</script>

</body>
</html>
