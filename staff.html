<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff</title>

<style>
body {
  font-family: Arial;
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card {
  border:1px solid #ddd;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
}

button {
  padding:6px 10px;
  margin-top:5px;
  margin-right:5px;
}

input, select {
  padding:8px;
  margin-top:10px;
  width:100%;
}

.stato-CONFERMATA { background:#d4edda; }
.stato-PENDING { background:#fff3cd; }
.stato-RIFIUTATA { background:#f8d7da; }

.tavolo {
  width:80px;
  margin-top:5px;
}
</style>
</head>

<body>

<h2>👨‍🍳 Gestionale Staff</h2>

<label>Ristorante</label>
<select id="ristorante">
  <option value="roma">Roma</option>
  <option value="napoli">Napoli</option>
  <option value="vairano">Vairano</option>
</select>

<label>Data</label>
<input type="date" id="data">

<button onclick="carica()">Carica</button>

<h3>📋 Prenotazioni</h3>
<div id="lista"></div>

<hr>

<h3>➕ Inserisci Prenotazione</h3>

<input type="time" id="ora">
<input type="text" id="nome" placeholder="Nome">
<input type="text" id="telefono" placeholder="Telefono">
<input type="number" id="persone" placeholder="Persone">

<button onclick="aggiungi()">Aggiungi</button>

<script>

const API_URL = "/api/proxy";

let prenotazioni = [];

// ================= CARICA =================
async function carica() {

  const ristorante = document.getElementById("ristorante").value;
  const data = document.getElementById("data").value;

  try {

    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        action: "getPrenotazioniGiorno",
        ristorante,
        data
      })
    });

    const json = await res.json();
    console.log("RESPONSE:", json);

    prenotazioni = json.data || [];

    mostra();

  } catch (e) {
    console.error("Errore:", e);
  }
}

// ================= MOSTRA =================
function mostra() {

  const div = document.getElementById("lista");
  div.innerHTML = "";

  if (!prenotazioni.length) {
    div.innerHTML = "Nessuna prenotazione";
    return;
  }

  prenotazioni.forEach(p => {

    div.innerHTML += `
      <div class="card stato-${p.stato}">
        <b>${p.ora}</b> - ${p.nome} (${p.persone})<br>
        📞 ${p.telefono}<br>

        Stato: <b>${p.stato}</b><br>

        🪑 Tavolo:
        <input class="tavolo" value="${p.tavolo || ''}" 
        onchange="setTavolo(${p.row}, this.value)">

        <br>

        <button onclick="conferma(${p.row})">✅</button>
        <button onclick="rifiuta(${p.row})">❌</button>
        <button onclick="elimina(${p.row})">🗑️</button>
      </div>
    `;
  });
}

// ================= TAVOLO =================
async function setTavolo(row, tavolo) {

  const ristorante = document.getElementById("ristorante").value;

  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"aggiornaTavolo",
      ristorante,
      row,
      tavolo
    })
  });
}

// ================= STATO =================
async function conferma(row) {
  aggiornaStato(row, "CONFERMATA");
}

async function rifiuta(row) {
  aggiornaStato(row, "RIFIUTATA");
}

async function aggiornaStato(row, stato) {

  const ristorante = document.getElementById("ristorante").value;

  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"aggiornaStatoPrenotazione",
      ristorante,
      row,
      stato
    })
  });

  carica();
}

// ================= ELIMINA =================
async function elimina(row) {

  const ristorante = document.getElementById("ristorante").value;

  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"eliminaPrenotazione",
      ristorante,
      row
    })
  });

  carica();
}

// ================= AGGIUNGI =================
async function aggiungi() {

  const ristorante = document.getElementById("ristorante").value;
  const data = document.getElementById("data").value;

  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"aggiungiPrenotazioneStaff",
      ristorante,
      data,
      ora: document.getElementById("ora").value,
      nome: document.getElementById("nome").value,
      telefono: document.getElementById("telefono").value,
      persone: Number(document.getElementById("persone").value)
    })
  });

  carica();
}

</script>

</body>
</html>
