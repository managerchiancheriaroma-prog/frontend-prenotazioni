<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff Roma</title>

<style>
body { font-family: Arial; max-width:600px; margin:auto; padding:20px; }
.card { border:1px solid #ddd; padding:10px; margin-top:10px; border-radius:6px; }
button { padding:6px 10px; margin-top:5px; }
</style>
</head>

<body>

<h2>Staff Roma</h2>

<input type="date" id="data">
<button onclick="carica()">Carica</button>

<h3>📊 Riepilogo</h3>
<div id="riepilogo"></div>

<h3>📋 Prenotazioni</h3>
<div id="lista"></div>

<script>

const API_URL = "/api/proxy";
const RISTORANTE = "roma";

async function carica() {

  const data = document.getElementById("data").value;

  const res1 = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"getPrenotazioniGiorno",
      ristorante: RISTORANTE,
      data
    })
  });

  const lista = await res1.json();
  mostra(lista);

  const res2 = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"getRiepilogoGiorno",
      ristorante: RISTORANTE,
      data
    })
  });

  const riepilogo = await res2.json();

  document.getElementById("riepilogo").innerHTML =
    "Pranzo: " + riepilogo.pranzo + "/" + riepilogo.maxPranzo +
    "<br>Cena: " + riepilogo.cena + "/" + riepilogo.maxCena;
}

function mostra(lista) {

  const div = document.getElementById("lista");
  div.innerHTML = "";

  if (!Array.isArray(lista) || lista.length === 0) {
    div.innerHTML = "Nessuna prenotazione";
    return;
  }

  lista.forEach(p => {
    div.innerHTML += `
      <div class="card">
        <b>${p.ora}</b> - ${p.nome} (${p.persone})<br>
        Stato: ${p.stato}

        <br>

        <button onclick="conferma(${p.row})">Conferma</button>
        <button onclick="rifiuta(${p.row})">Rifiuta</button>
        <button onclick="elimina(${p.row})">Elimina</button>
      </div>
    `;
  });
}

async function conferma(row) {
  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"aggiornaStatoPrenotazione",
      ristorante: RISTORANTE,
      row,
      stato:"CONFERMATA"
    })
  });
  carica();
}

async function rifiuta(row) {
  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"aggiornaStatoPrenotazione",
      ristorante: RISTORANTE,
      row,
      stato:"RIFIUTATA"
    })
  });
  carica();
}

async function elimina(row) {
  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"eliminaPrenotazione",
      ristorante: RISTORANTE,
      row
    })
  });
  carica();
}

</script>

</body>
</html>
