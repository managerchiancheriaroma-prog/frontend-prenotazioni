<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff Login</title>

<style>
body {
  font-family: Arial;
  max-width:1300px;
  margin:auto;
  padding:20px;
  background:#f5f5f5;
}

/* 🔐 LOGIN OVERLAY */
#loginScreen {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10000;
}

.loginBox {
  background:white;
  padding:30px;
  border-radius:10px;
  text-align:center;
  width:300px;
}

.loginBox input {
  width:100%;
  padding:10px;
  margin-top:10px;
}

.loginBox button {
  width:100%;
  padding:10px;
  margin-top:15px;
  background:#333;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* overlay popup */
#overlay {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  display:none;
  z-index:9998;
}

/* toast modal */
#toast {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#333;
  color:white;
  padding:25px 30px;
  border-radius:12px;
  font-size:18px;
  text-align:center;
  min-width:280px;
  display:none;
  z-index:9999;
  cursor:pointer;
}

.header {
  display:flex;
  justify-content:space-between;
  gap:20px;
}

.left, .right {
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.left select, .left input,
.right input {
  margin:5px;
  padding:8px;
}

button {
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#333;
  color:white;
}

.container {
  display:flex;
  gap:20px;
  margin-top:20px;
}

.col {
  flex:1;
}

.card {
  background:white;
  border-radius:10px;
  padding:10px;
  margin-top:10px;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.selected {
  border:2px solid #00bcd4;
}

.tavoli {
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:10px;
}

.tavolo {
  padding:15px;
  border-radius:10px;
  text-align:center;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.libero { background:#4caf50; }
.pending { background:#ff9800; }
.confermato { background:#f44336; }

h3 {
  margin-top:20px;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="loginScreen">
  <div class="loginBox">
    <h3>Login Staff</h3>

    <select id="loginRistorante">
      <option value="roma">Roma</option>
      <option value="napoli">Napoli</option>
      <option value="vairano">Vairano</option>
    </select>

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Accedi</button>

    <p id="loginError" style="color:red;"></p>
  </div>
</div>

<div id="overlay"></div>
<div id="toast" onclick="closeToast()"></div>

<h2>Gestione Staff</h2>

<div class="header">

  <div class="left">

    <select id="ristorante" onchange="carica()">
      <option value="roma">Roma</option>
      <option value="napoli">Napoli</option>
      <option value="vairano">Vairano</option>
    </select>

    <input type="date" id="data" onchange="carica()">

    <select id="servizio" onchange="render()">
      <option value="tutti">Tutti</option>
      <option value="pranzo">Pranzo</option>
      <option value="cena">Cena</option>
    </select>

  </div>

  <div class="right">

    <b>➕ Nuova prenotazione</b><br>

    <input type="time" id="ora">
    <input type="text" id="nome">
    <input type="text" id="telefono">
    <input type="number" id="persone">

    <br>
    <button onclick="aggiungi()">Aggiungi</button>

  </div>

</div>

<div class="container">

<div class="col">
  <h3>Prenotazioni</h3>
  <div id="lista"></div>
</div>

<div class="col">

<h3>Sala Interna</h3>
<div id="interna" class="tavoli"></div>

<h3>Sala Esterna</h3>
<div id="esterna" class="tavoli"></div>

</div>

</div>

<script>

const API_URL = "/api/proxy";

const PASSWORDS = {
  roma: "roma123",
  napoli: "napoli456",
  vairano: "vairano789"
};

let prenotazioni = [];
let selezionata = null;
let snapshot = [];
let ristoranteAttivo = null;

// ================= LOGIN =================
function login() {

  const r = document.getElementById("loginRistorante").value;
  const pw = document.getElementById("password").value;

  if (PASSWORDS[r] === pw) {

    sessionStorage.setItem("auth_" + r, "true");
    ristoranteAttivo = r;

    document.getElementById("loginScreen").style.display = "none";

    document.getElementById("ristorante").value = r;

    const today = new Date().toISOString().split("T")[0];
    document.getElementById("data").value = today;

    carica();
    setInterval(refreshSilenzioso, 15000);

  } else {
    document.getElementById("loginError").innerText = "Password errata";
  }
}

// ================= INIT CHECK =================
window.onload = () => {

  const r = "roma"; // default check

  if (sessionStorage.getItem("auth_roma") === "true" ||
      sessionStorage.getItem("auth_napoli") === "true" ||
      sessionStorage.getItem("auth_vairano") === "true") {

    document.getElementById("loginScreen").style.display = "none";
  }
};

// ================= FETCH =================
async function carica() {

  const ristorante = document.getElementById("ristorante").value;
  const data = document.getElementById("data").value;

  if (!data) return;

  const res = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"getPrenotazioniGiorno",
      ristorante,
      data
    })
  });

  const json = await res.json();
  prenotazioni = json.data || [];

  prenotazioni.sort((a,b) => a.ora.localeCompare(b.ora));

  render();
}

// ================= REFRESH =================
async function refreshSilenzioso() {

  const ristorante = document.getElementById("ristorante").value;
  const data = document.getElementById("data").value;

  if (!data) return;

  const res = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"getPrenotazioniGiorno",
      ristorante,
      data
    })
  });

  const json = await res.json();
  const nuove = json.data || [];

  const oldSnapshot = snapshot;
  snapshot = nuove.map(p => `${p.row}-${p.ora}-${p.nome}-${p.telefono}`);

  const newItems = nuove.filter(p =>
    !oldSnapshot.includes(`${p.row}-${p.ora}-${p.nome}-${p.telefono}`)
  );

  prenotazioni = nuove;

  if (newItems.length > 0) {
    newItems.forEach(p => {
      showToast(`🔔 Nuova prenotazione:\n${p.nome} - ${p.ora}`);
    });
  }

  render();
}

// ================= TOAST =================
function showToast(msg) {
  document.getElementById("toast").innerText = msg;
  document.getElementById("toast").style.display = "block";
  document.getElementById("overlay").style.display = "block";
}

function closeToast() {
  document.getElementById("toast").style.display = "none";
  document.getElementById("overlay").style.display = "none";
}

document.getElementById("overlay").onclick = closeToast;

// ================= RESTO IDENTICO =================

function tipo(ora) {
  const [h] = ora.split(":").map(Number);
  return (h <= 17) ? "pranzo" : "cena";
}

function render() {
  renderLista();
  renderTavoli();
}

function renderLista() { /* invariato */ }
function renderTavoli() { /* invariato */ }
function statoTavolo() { /* invariato */ }
function creaTavolo() { /* invariato */ }
function assegna() { /* invariato */ }
function aggiungi() { /* invariato */ }

</script>

</body>
</html>
