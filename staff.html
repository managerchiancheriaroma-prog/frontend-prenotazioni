<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff</title>

<style>
body {
  font-family: Arial;
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card {
  border:1px solid #ddd;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
}

button {
  padding:6px 10px;
  margin-top:5px;
  margin-right:5px;
}

select, input {
  padding:8px;
  margin-top:10px;
  width:100%;
}

.section {
  margin-top:30px;
}

.box {
  padding:10px;
  border-radius:6px;
  margin-top:10px;
}

.pranzo { background:#e3f2fd; }
.cena { background:#fce4ec; }

</style>
</head>

<body>

<h2>👨‍🍳 Pannello Staff</h2>

<label>Ristorante</label>
<select id="ristorante">
  <option value="roma">Roma</option>
  <option value="napoli">Napoli</option>
  <option value="vairano">Vairano</option>
</select>

<label>Data</label>
<input type="date" id="data">

<button onclick="carica()">Carica</button>

<!-- 🔥 RIEPILOGO -->
<h3>📊 Panoramica</h3>
<div id="riepilogo"></div>

<!-- 🔥 SELEZIONE SERVIZIO -->
<h3>🔎 Servizio</h3>
<select id="servizio" onchange="filtra()">
  <option value="tutti">Tutti</option>
  <option value="pranzo">Pranzo</option>
  <option value="cena">Cena</option>
</select>

<!-- 🔥 LISTE SEPARATE -->
<div class="section">
  <h3>🍽️ PRANZO</h3>
  <div id="listaPranzo"></div>
</div>

<div class="section">
  <h3>🌙 CENA</h3>
  <div id="listaCena"></div>
</div>

<!-- 🔥 INSERIMENTO -->
<h3>➕ Inserisci Prenotazione</h3>

<input type="time" id="ora">
<input type="text" id="nome" placeholder="Nome">
<input type="text" id="telefono" placeholder="Telefono">
<input type="number" id="persone" placeholder="Persone">

<button onclick="aggiungi()">Aggiungi</button>

<script>

const API_URL = "/api/proxy";

let prenotazioni = [];

// ===== CARICA =====
async function carica() {

  const ristorante = document.getElementById("ristorante").value;
  const data = document.getElementById("data").value;

  // PRENOTAZIONI
  const res1 = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"getPrenotazioniGiorno",
      ristorante,
      data
    })
  });

  prenotazioni = await res1.json();

  filtra();

  // RIEPILOGO
  const res2 = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"getRiepilogoGiorno",
      ristorante,
      data
    })
  });

  const r = await res2.json();

  document.getElementById("riepilogo").innerHTML =
    "<div class='box pranzo'>🍽️ Pranzo: " + r.pranzo + "/" + r.maxPranzo + "</div>" +
    "<div class='box cena'>🌙 Cena: " + r.cena + "/" + r.maxCena + "</div>";
}

// ===== FILTRO =====
function filtra() {

  const servizio = document.getElementById("servizio").value;

  const pranzo = [];
  const cena = [];

  prenotazioni.forEach(p => {

    const [h,m] = p.ora.split(":").map(Number);
    const min = h*60 + m;

    if (min <= 17*60+30) {
      pranzo.push(p);
    } else {
      cena.push(p);
    }
  });

  if (servizio === "pranzo") {
    mostra(pranzo, "listaPranzo");
    document.getElementById("listaCena").innerHTML = "";
  }
  else if (servizio === "cena") {
    mostra(cena, "listaCena");
    document.getElementById("listaPranzo").innerHTML = "";
  }
  else {
    mostra(pranzo, "listaPranzo");
    mostra(cena, "listaCena");
  }
}

// ===== MOSTRA =====
function mostra(lista, id) {

  const div = document.getElementById(id);
  div.innerHTML = "";

  if (!lista || lista.length === 0) {
    div.innerHTML = "Nessuna prenotazione";
    return;
  }

  lista.forEach(p => {
    div.innerHTML += `
      <div class="card">
        <b>${p.ora}</b> - ${p.nome} (${p.persone})<br>
        📞 ${p.telefono}<br>
        Stato: <b>${p.stato}</b>

        <br><br>

        <button onclick="conferma(${p.row})">✅</button>
        <button onclick="rifiuta(${p.row})">❌</button>
        <button onclick="elimina(${p.row})">🗑️</button>
      </div>
    `;
  });
}

// ===== AZIONI =====
async function conferma(row) {

  const ristorante = document.getElementById("ristorante").value;

  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"aggiornaStatoPrenotazione",
      ristorante,
      row,
      stato:"CONFERMATA"
    })
  });

  carica();
}

async function rifiuta(row) {

  const ristorante = document.getElementById("ristorante").value;

  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"aggiornaStatoPrenotazione",
      ristorante,
      row,
      stato:"RIFIUTATA"
    })
  });

  carica();
}

async function elimina(row) {

  const ristorante = document.getElementById("ristorante").value;

  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"eliminaPrenotazione",
      ristorante,
      row
    })
  });

  carica();
}

// ===== AGGIUNTA =====
async function aggiungi() {

  const ristorante = document.getElementById("ristorante").value;
  const data = document.getElementById("data").value;

  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"aggiungiPrenotazioneStaff",
      ristorante,
      data,
      ora: document.getElementById("ora").value,
      nome: document.getElementById("nome").value,
      telefono: document.getElementById("telefono").value,
      persone: Number(document.getElementById("persone").value)
    })
  });

  carica();
}

</script>

</body>
</html>
