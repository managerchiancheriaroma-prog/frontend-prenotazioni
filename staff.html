<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff</title>

<style>
body {
  font-family: Arial;
  max-width:1300px;
  margin:auto;
  padding:20px;
  background:#f5f5f5;
}

/* LOGIN */
#loginScreen {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10000;
}

.loginBox {
  background:white;
  padding:30px;
  border-radius:10px;
  text-align:center;
  width:300px;
}

.loginBox input, .loginBox select {
  width:100%;
  padding:10px;
  margin-top:10px;
}

.loginBox button {
  width:100%;
  padding:10px;
  margin-top:15px;
  background:#333;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* POPUP */
#overlay {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  display:none;
  z-index:9998;
}

#toast {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#333;
  color:white;
  padding:25px;
  border-radius:12px;
  display:none;
  z-index:9999;
  text-align:center;
  cursor:pointer;
}

/* LAYOUT */
.header {
  display:flex;
  justify-content:space-between;
  gap:20px;
}

.left, .right {
  background:white;
  padding:15px;
  border-radius:10px;
}

.container {
  display:flex;
  gap:20px;
  margin-top:20px;
}

.col { flex:1; }

.card {
  background:white;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  cursor:pointer;
}

.selected { border:2px solid #00bcd4; }

.tavoli {
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:10px;
}

.tavolo {
  padding:15px;
  border-radius:10px;
  text-align:center;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.libero { background:#4caf50; }
.pending { background:#ff9800; }
.confermato { background:#f44336; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginBox">
    <h3>Login Staff</h3>

    <select id="loginRistorante">
      <option value="roma">Roma</option>
      <option value="napoli">Napoli</option>
      <option value="vairano">Vairano</option>
    </select>

    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Accedi</button>

    <p id="loginError" style="color:red;"></p>
  </div>
</div>

<div id="overlay"></div>
<div id="toast" onclick="closeToast()"></div>

<h2>Gestione Staff</h2>

<div class="header">

  <div class="left">

    <select id="ristorante" onchange="checkRistorante()">
      <option value="roma">Roma</option>
      <option value="napoli">Napoli</option>
      <option value="vairano">Vairano</option>
    </select>

    <input type="date" id="data" onchange="carica()">

    <select id="servizio" onchange="render()">
      <option value="tutti">Tutti</option>
      <option value="pranzo">Pranzo</option>
      <option value="cena">Cena</option>
    </select>

  </div>

  <div class="right">
    <b>➕ Nuova prenotazione</b><br>
    <input type="time" id="ora">
    <input type="text" id="nome">
    <input type="text" id="telefono">
    <input type="number" id="persone">
    <br>
    <button onclick="aggiungi()">Aggiungi</button>
  </div>

</div>

<div class="container">

<div class="col">
  <h3>Prenotazioni</h3>
  <div id="lista"></div>
</div>

<div class="col">
  <h3>Sala Interna</h3>
  <div id="interna" class="tavoli"></div>

  <h3>Sala Esterna</h3>
  <div id="esterna" class="tavoli"></div>
</div>

</div>

<script>

const API_URL = "/api/proxy";

const PASSWORDS = {
  roma: "roma123",
  napoli: "napoli456",
  vairano: "vairano789"
};

let prenotazioni = [];
let selezionata = null;
let snapshot = [];
let auth = null;

// ================= LOGIN =================
function login() {

  const r = document.getElementById("loginRistorante").value;
  const pw = document.getElementById("password").value;

  if (PASSWORDS[r] === pw) {

    auth = r;
    sessionStorage.setItem("staff_auth", r);

    document.getElementById("loginScreen").style.display = "none";

    document.getElementById("ristorante").value = r;
    document.getElementById("data").value = new Date().toISOString().split("T")[0];

    start();
  } else {
    document.getElementById("loginError").innerText = "Password errata";
  }
}

// ================= INIT =================
window.onload = () => {

  const saved = sessionStorage.getItem("staff_auth");

  if (saved) {
    auth = saved;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("ristorante").value = saved;
    document.getElementById("data").value = new Date().toISOString().split("T")[0];
    start();
  }
};

function start() {
  carica();
  setInterval(refreshSilenzioso, 15000);
}

// ================= BLOCCO CAMBIO RISTORANTE =================
function checkRistorante() {

  const val = document.getElementById("ristorante").value;

  if (val !== auth) {
    alert("Devi fare login per questo ristorante");
    document.getElementById("ristorante").value = auth;
  } else {
    carica();
  }
}

// ================= FETCH =================
async function carica() {

  const r = document.getElementById("ristorante").value;
  const d = document.getElementById("data").value;

  const res = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ action:"getPrenotazioniGiorno", ristorante:r, data:d })
  });

  const json = await res.json();
  prenotazioni = json.data || [];

  prenotazioni.sort((a,b)=>a.ora.localeCompare(b.ora));

  render();
}

// ================= REFRESH =================
async function refreshSilenzioso() {

  const r = document.getElementById("ristorante").value;
  const d = document.getElementById("data").value;

  const res = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ action:"getPrenotazioniGiorno", ristorante:r, data:d })
  });

  const json = await res.json();
  const nuove = json.data || [];

  const old = snapshot;
  snapshot = nuove.map(p => `${p.row}-${p.ora}-${p.nome}-${p.telefono}`);

  const newItems = nuove.filter(p => !old.includes(`${p.row}-${p.ora}-${p.nome}-${p.telefono}`));

  prenotazioni = nuove;

  if (newItems.length) {
    newItems.forEach(p=>{
      showToast(`Nuova prenotazione:\n${p.nome} - ${p.ora}`);
    });
  }

  render();
}

// ================= TOAST =================
function showToast(msg) {
  document.getElementById("toast").innerText = msg;
  document.getElementById("toast").style.display = "block";
  document.getElementById("overlay").style.display = "block";
}

function closeToast() {
  document.getElementById("toast").style.display = "none";
  document.getElementById("overlay").style.display = "none";
}

document.getElementById("overlay").onclick = closeToast;

// ================= RENDER =================
function render() {
  renderLista();
  renderTavoli();
}

function renderLista() {

  const f = document.getElementById("servizio").value;
  const div = document.getElementById("lista");

  div.innerHTML = "";

  prenotazioni.forEach(p=>{

    const servizio = (parseInt(p.ora) <= 17) ? "pranzo" : "cena";
    if (f !== "tutti" && f !== servizio) return;

    const el = document.createElement("div");
    el.className = "card";

    el.innerHTML = `
      <b>${p.ora}</b> - ${p.nome} (${p.persone})<br>
      ${p.telefono}<br>
      ${p.stato} - Tavolo ${p.tavolo || "-"}
    `;

    el.onclick = ()=>{ selezionata = p; };

    div.appendChild(el);
  });
}

function renderTavoli() {

  const interna = document.getElementById("interna");
  const esterna = document.getElementById("esterna");

  interna.innerHTML = "";
  esterna.innerHTML = "";

  for(let i=1;i<=16;i++) interna.appendChild(makeTable(i));
  [21,22,23,24,25,26,41,42].forEach(i=>esterna.appendChild(makeTable(i)));
}

function makeTable(n) {

  const div = document.createElement("div");
  div.className = "tavolo libero";
  div.innerText = n;

  div.onclick = ()=>alert("assegna tavolo (già esistente logica)");

  return div;
}

async function aggiungi() {
  const r = document.getElementById("ristorante").value;
  const d = document.getElementById("data").value;

  await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"aggiungiPrenotazioneStaff",
      ristorante:r,
      data:d,
      ora:ora.value,
      nome:nome.value,
      telefono:telefono.value,
      persone:Number(persone.value)
    })
  });

  carica();
}

</script>

</body>
</html>
