<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
  font-family: Arial;
  margin:0;
  padding:10px;
  background:#f5f5f5;
}

h2 { text-align:center; }

/* LOGIN */
#loginScreen {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.9);
  display:flex; justify-content:center; align-items:center;
  z-index:10000;
}

.loginBox {
  background:white; padding:25px; border-radius:10px;
  width:90%; max-width:320px;
}

/* HEADER */
.header {
  display:flex;
  flex-direction:column;
  gap:10px;
}

.left, .right {
  background:white;
  padding:10px;
  border-radius:10px;
}

/* LAYOUT */
.container {
  display:flex;
  flex-direction:column;
  gap:10px;
}

.col { width:100%; }

@media (min-width: 768px) {
  .container { flex-direction:row; }
  .col { width:50%; }
}

/* CARD */
.card {
  background:white;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  font-size:14px;
  cursor:pointer;
}

.selected {
  border:3px solid #00bcd4;
}

/* ACTIONS */
.actions button {
  margin:4px;
  padding:10px;
  font-size:14px;
  border:none;
  border-radius:6px;
}

/* TAVOLI */
.tavoli {
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:6px;
  margin-top:10px;
}

.tavolo {
  padding:10px;
  border-radius:8px;
  text-align:center;
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.libero { background:#4caf50; }
.pending { background:#ff9800; }
.confermato { background:#f44336; }
.arrivato { background:#2196f3; }

/* TOAST */
#overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.4);
  display:none;
}

#toast {
  position:fixed;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  background:#333;
  color:white;
  padding:25px;
  border-radius:12px;
  display:none;
  text-align:center;
  font-size:18px;
}

/* INPUT */
.field { margin-top:10px; }
.field label { font-size:13px; }
.field input {
  width:100%;
  padding:10px;
  font-size:16px;
}

button {
  padding:12px;
  font-size:16px;
  margin-top:10px;
  background:#333;
  color:white;
}

/* UI tavolo destra */
.row-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.row-bottom {
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-size:13px;
  opacity:0.9;
}

.tavolo-right {
  font-weight:bold;
  min-width:70px;
  text-align:right;
}

</style>
</head>

<body>

<div id="loginScreen">
  <div class="loginBox">
    <h3>Login Staff</h3>

    <select id="loginRistorante">
      <option value="roma">Roma</option>
      <option value="napoli">Napoli</option>
      <option value="vairano">Vairano</option>
    </select>

    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Accedi</button>

    <p id="loginError" style="color:red;"></p>
  </div>
</div>

<div id="overlay" onclick="closeToast()"></div>
<div id="toast" onclick="closeToast()"></div>

<h2>Gestione Staff</h2>

<div class="header">

<div class="left">
<select id="ristorante">
<option value="roma">Roma</option>
<option value="napoli">Napoli</option>
<option value="vairano">Vairano</option>
</select>

<input type="date" id="data" onchange="carica()">

<select id="servizio" onchange="render()">
<option value="tutti">Tutti</option>
<option value="pranzo">Pranzo</option>
<option value="cena">Cena</option>
</select>
</div>

<div class="right">

<b>➕ Nuova prenotazione</b>

<div class="field">
<label>Ora</label>
<input type="time" id="ora">
</div>

<div class="field">
<label>Nome cliente</label>
<input type="text" id="nome">
</div>

<div class="field">
<label>Telefono</label>
<input type="text" id="telefono">
</div>

<div class="field">
<label>Numero persone</label>
<input type="number" id="persone">
</div>

<button onclick="aggiungi()">Aggiungi</button>

</div>

</div>

<div class="container">

<div class="col">
<h3>Prenotazioni</h3>
<div id="lista"></div>
</div>

<div class="col">

<h3>Sala Interna</h3>
<div id="interna" class="tavoli"></div>

<h3>Sala Esterna</h3>
<div id="esterna" class="tavoli"></div>

</div>

</div>

<script>

const API_URL = "/api/proxy";

let prenotazioni = [];
let selezionata = null;
let snapshot = [];

/* AVVIO */
window.onload = () => {
  data.value = new Date().toISOString().split("T")[0];
  start();
};

function start(){
  carica();
  setInterval(refreshSilenzioso, 10000);
}

/* CARICA */
async function carica() {
  const res = await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"getPrenotazioniGiorno",
      ristorante:ristorante.value,
      data:data.value
    })
  });

  const json = await res.json();
  prenotazioni = json.data || [];
  snapshot = prenotazioni.map(p => p.row);
  prenotazioni.sort((a,b)=>a.ora.localeCompare(b.ora));

  render();
}

/* REFRESH INTELLIGENTE */
async function refreshSilenzioso() {

  const res = await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"getPrenotazioniGiorno",
      ristorante:ristorante.value,
      data:data.value
    })
  });

  const json = await res.json();
  const nuove = json.data || [];

  const nuovi = nuove.filter(p => !snapshot.includes(p.row));

  if (nuovi.length > 0) {
    showToast("Nuova prenotazione");
  }

  prenotazioni = nuove;
  snapshot = nuove.map(p=>p.row);

  prenotazioni.sort((a,b)=>a.ora.localeCompare(b.ora));

  render();
}

/* TOAST */
function showToast(msg){
  toast.innerText = msg;
  toast.style.display="block";
  overlay.style.display="block";
}

function closeToast(){
  toast.style.display="none";
  overlay.style.display="none";
}

/* RENDER */
function render(){
  renderLista();
  renderTavoli();
}

/* LISTA */
function renderLista(){
  lista.innerHTML="";

  prenotazioni.forEach(p=>{
    const el=document.createElement("div");
    el.className="card";

    if (selezionata && selezionata.row === p.row) {
      el.classList.add("selected");
    }

    el.onclick = () => selectRow(p.row);

    el.innerHTML=`
      <div class="row-top">
        <b>${p.nome}</b>
        <span>${p.ora}</span>
      </div>

      <div class="row-bottom">
        <div>👥 ${p.persone}</div>
        <div class="tavolo-right">🍽 ${p.tavolo || "-"}</div>
      </div>

      <div class="actions">
        <button onclick="conferma(event,${p.row})">✔ Conferma</button>
        <button onclick="arrivato(event,${p.row})">🍽 Arrivato</button>
        <button onclick="libera(event,${p.row})">🧹 Libera</button>
        <button onclick="elimina(event,${p.row})">🗑 Elimina</button>
      </div>
    `;

    lista.appendChild(el);
  });
}

/* resto invariato */
function selectRow(row){
  selezionata = prenotazioni.find(p => p.row === row) || null;
  render();
}

function renderTavoli(){
  interna.innerHTML="";
  esterna.innerHTML="";
}

async function aggiungi(){
  await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"aggiungiPrenotazioneStaff",
      ristorante:ristorante.value,
      data:data.value,
      ora:ora.value,
      nome:nome.value,
      telefono:telefono.value,
      persone:Number(persone.value)
    })
  });

  carica();
}

async function conferma(e,row){
  e.stopPropagation();
  await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    action:"aggiornaStatoPrenotazione",
    ristorante:ristorante.value,
    row,
    stato:"CONFERMATA"
  })});
}

async function arrivato(e,row){
  e.stopPropagation();
  await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    action:"aggiornaStatoPrenotazione",
    ristorante:ristorante.value,
    row,
    stato:"ARRIVATO"
  })});
}

async function libera(e,row){
  e.stopPropagation();
  await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    action:"aggiornaTavolo",
    ristorante:ristorante.value,
    row,
    tavolo:""
  })});
}

async function elimina(e,row){
  e.stopPropagation();
  await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    action:"eliminaPrenotazione",
    ristorante:ristorante.value,
    row
  })});
}

</script>

</body>
</html>
