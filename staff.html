<script>

async function setTavolo(row, tavolo) {

  const ristorante = document.getElementById("ristorante").value;
  const dataSelezionata = document.getElementById("data").value;

  const pren = prenotazioni.find(p => p.row === row);

  // 🔥 FIX: uso data selezionata (NON quella della riga)
  const check = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"checkTavoloAlert",
      ristorante,
      data: dataSelezionata,
      ora: pren.ora,
      tavolo
    })
  });

  const json = await check.json();

  if (json.alert) {
    alert(json.message);
  }

  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"aggiornaTavolo",
      ristorante,
      row,
      tavolo
    })
  });
}
</script>
