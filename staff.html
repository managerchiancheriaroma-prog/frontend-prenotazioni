<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff Gestionale</title>

<style>
body {
  font-family: Arial;
  max-width:1000px;
  margin:auto;
  padding:20px;
}

h2 { margin-bottom: 10px; }

.container {
  display: flex;
  gap: 20px;
}

.col {
  flex: 1;
}

.card {
  border:1px solid #ddd;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  background:#fff;
}

.pranzo { border-left:5px solid #4caf50; }
.cena { border-left:5px solid #2196f3; }

button {
  padding:6px 10px;
  margin:4px;
  cursor:pointer;
}

input, select {
  padding:8px;
  margin-top:8px;
  width:100%;
}

.tavolo {
  width:80px;
  margin-top:5px;
}

.badge {
  padding:2px 6px;
  border-radius:4px;
  font-size:12px;
  color:white;
}

.CONFERMATA { background:#4caf50; }
.PENDING { background:#ff9800; }
.RIFIUTATA { background:#f44336; }

</style>
</head>

<body>

<h2>👨‍🍳 Staff Gestionale Ristoranti</h2>

<select id="ristorante">
  <option value="roma">Roma</option>
  <option value="napoli">Napoli</option>
  <option value="vairano">Vairano</option>
</select>

<input type="date" id="data">

<button onclick="carica()">Carica Prenotazioni</button>

<hr>

<h3>📊 Prenotazioni</h3>

<div class="container">

  <div class="col">
    <h3>🍽 PRANZO</h3>
    <div id="pranzo"></div>
  </div>

  <div class="col">
    <h3>🌙 CENA</h3>
    <div id="cena"></div>
  </div>

</div>

<script>

const API_URL = "/api/proxy";

let prenotazioni = [];

// ================= CARICA =================
async function carica() {

  const ristorante = document.getElementById("ristorante").value;
  const data = document.getElementById("data").value;

  const res = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"getPrenotazioniGiorno",
      ristorante,
      data
    })
  });

  const json = await res.json();

  prenotazioni = json.data || [];

  render();
}

// ================= RENDER =================
function render() {

  const pranzoDiv = document.getElementById("pranzo");
  const cenaDiv = document.getElementById("cena");

  pranzoDiv.innerHTML = "";
  cenaDiv.innerHTML = "";

  prenotazioni.forEach(p => {

    const el = `
      <div class="card ${tipo(p.ora)}">
        <b>${p.ora}</b> - ${p.nome} (${p.persone})<br>

        📞 ${p.telefono}<br>

        Stato:
        <span class="badge ${p.stato}">${p.stato}</span><br>

        🪑 Tavolo:
        <input class="tavolo" value="${p.tavolo || ''}"
        onchange="setTavolo(${p.row}, this.value)">

        <br>

        <button onclick="conferma(${p.row})">✔</button>
        <button onclick="rifiuta(${p.row})">✖</button>
        <button onclick="elimina(${p.row})">🗑</button>
      </div>
    `;

    if (tipo(p.ora) === "pranzo") {
      pranzoDiv.innerHTML += el;
    } else {
      cenaDiv.innerHTML += el;
    }
  });
}

// ================= TIPO =================
function tipo(ora) {
  const [h,m] = ora.split(":").map(Number);
  return (h*60+m <= 17*60+30) ? "pranzo" : "cena";
}

// ================= ALERT TAVOLO =================
async function setTavolo(row, tavolo) {

  const ristorante = document.getElementById("ristorante").value;

  const pren = prenotazioni.find(p => p.row === row);

  const check = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"checkTavoloAlert",
      ristorante,
      data: pren.data,
      ora: pren.ora,
      tavolo
    })
  });

  const json = await check.json();

  if (json.alert) {
    alert(json.message);
  }

  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"aggiornaTavolo",
      ristorante,
      row,
      tavolo
    })
  });
}

// ================= STATO =================
async function conferma(row) { update(row,"CONFERMATA"); }
async function rifiuta(row) { update(row,"RIFIUTATA"); }

async function update(row, stato) {

  const ristorante = document.getElementById("ristorante").value;

  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"aggiornaStatoPrenotazione",
      ristorante,
      row,
      stato
    })
  });

  carica();
}

// ================= ELIMINA =================
async function elimina(row) {

  const ristorante = document.getElementById("ristorante").value;

  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"eliminaPrenotazione",
      ristorante,
      row
    })
  });

  carica();
}

</script>

</body>
</html>
