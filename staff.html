<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff</title>

<style>
body {
  font-family: Arial;
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card {
  border:1px solid #ddd;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
}

button {
  padding:6px 10px;
  margin-top:5px;
  margin-right:5px;
}

select, input {
  padding:8px;
  margin-top:10px;
  width:100%;
}
</style>
</head>

<body>

<h2>👨‍🍳 Staff</h2>

<select id="ristorante">
  <option value="roma">Roma</option>
  <option value="napoli">Napoli</option>
  <option value="vairano">Vairano</option>
</select>

<input type="date" id="data">

<button onclick="carica()">Carica</button>

<h3>📋 Prenotazioni</h3>
<div id="lista"></div>

<script>

const API_URL = "/api/proxy";

let prenotazioni = [];

// ================= CARICA =================
async function carica() {

  const ristorante = document.getElementById("ristorante").value;
  const data = document.getElementById("data").value;

  try {

    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        action: "getPrenotazioniGiorno",
        ristorante,
        data
      })
    });

    const json = await res.json();

    console.log("RESPONSE:", json);

    prenotazioni = json.data || [];

    mostra();

  } catch (e) {
    console.error("Errore fetch:", e);
  }
}

// ================= MOSTRA =================
function mostra() {

  const div = document.getElementById("lista");
  div.innerHTML = "";

  if (!prenotazioni.length) {
    div.innerHTML = "Nessuna prenotazione";
    return;
  }

  prenotazioni.forEach(p => {

    div.innerHTML += `
      <div class="card">
        <b>${p.ora}</b> - ${p.nome} (${p.persone})<br>
        📞 ${p.telefono}<br>
        Stato: <b>${p.stato}</b><br>
        🪑 Tavolo: ${p.tavolo || "-"}
      </div>
    `;
  });
}

</script>

</body>
</html>
